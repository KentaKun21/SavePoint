.sdw .frame{overflow:hidden;transform:rotate(-1.2deg)}

/* Persona 5 game-opening slash; exit keeps the existing paper crumple. */
#sh{position:fixed;inset:0;transform:none;transform-origin:center;will-change:clip-path}



@keyframes p5ScreenReveal{0%{clip-path:polygon(0 0,0 0,0 100%,0 100%)}45%{clip-path:polygon(0 0,42% 0,18% 100%,0 100%)}100%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}

.sdg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}.sdg .cd{display:block;width:100%;min-width:0;aspect-ratio:1/1;height:auto;background-size:cover!important;background-position:center top!important;background-repeat:no-repeat!important;overflow:hidden;box-sizing:border-box}

/* Persona 5 menu hover effect (adapted from the supplied pen: jelly shapes, tilt-bounce label) */
.tb{flex:1;border:0;background:none;padding:0;height:64px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.lw{position:relative;display:inline-block;margin:0 8px;isolation:isolate}
.lw .fb{display:block;font:400 18px/0 P5Hatty,sans-serif;letter-spacing:.08em;opacity:0;position:relative;top:10px;left:0;white-space:nowrap}
.lw .iw{display:block}
.lw .lb{display:block;position:absolute;left:0;right:0;top:-3px;margin:0 auto;text-align:center;font:400 18px/1 P5Hatty,sans-serif;letter-spacing:.08em;color:#fff;text-shadow:2px 2px 0 #000;z-index:3;white-space:nowrap}
.lw .sw{display:none;z-index:1;position:absolute;top:-1px;left:0;right:0;transform:rotate(-6deg);filter:sepia(50%) saturate(3)}
.tb:nth-child(even) .sw{transform:rotate(11deg)}
.lw .sh{display:block;transition:all .1s linear;position:absolute;top:0;left:0;right:0;height:26px;overflow:hidden}
.lw .sh svg{position:absolute;left:0;top:0;width:100%;height:auto}
.lw .sh.cy{mix-blend-mode:screen;animation-delay:.05s;animation-duration:1s}
.lw .sh.rd{animation-duration:1.15s;animation-delay:.08s;opacity:.8}
.jelly{animation-name:jelly;transform-origin:center;animation-iteration-count:infinite;animation-timing-function:linear}
.tb.on .lw,.tb.hit .lw{z-index:9999}
.tb.on .sw,.tb.hit .sw{display:block}
.tb.on .sw .cy,.tb.hit .sw .cy{transform:scale(3,.1)}
.tb.on .lb,.tb.hit .lb{animation:tiltBounce .3s ease;animation-fill-mode:forwards}
.tb:nth-child(even).on .lb,.tb:nth-child(even).hit .lb{animation:tiltBounceAlt .3s ease;animation-fill-mode:forwards}
@media(hover:hover){.tb:hover .lw{z-index:9999}.tb:hover .sw{display:block}.tb:hover .sw .cy{transform:scale(3,.1)}.tb:hover .lb{animation:tiltBounce .3s ease;animation-fill-mode:forwards}.tb:nth-child(even):hover .lb{animation:tiltBounceAlt .3s ease;animation-fill-mode:forwards}}
@keyframes tiltBounce{0%{transform:scale(1) rotate(-7deg)}50%{transform:scale(1.35) rotate(-7deg)}100%{transform:scale(1.12) rotate(-7deg)}}
@keyframes tiltBounceAlt{0%{transform:scale(1) rotate(7deg)}50%{transform:scale(1.35) rotate(7deg)}100%{transform:scale(1.12) rotate(7deg)}}
@keyframes jelly{0%{width:100%;transform:scale(1.2,1) skewX(8deg) translateY(2px) rotateX(16deg) rotateY(5deg) rotateZ(-4deg)}50%{width:100%;transform:scale(1.2,1.05) skewX(-6deg) translateY(-1px) translateZ(-12px)}100%{width:100%;transform:scale(1.2,1) skewX(8deg) translateY(2px) rotateX(-16deg) rotateY(-5deg) rotateZ(-6deg)}}

/* === SavePoint mobile scaling + chrome fixes === */
html, body {
  width: 100% !important;
  max-width: 100% !important;
  overflow-x: hidden !important;
  overscroll-behavior-x: none;
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
.app {
  width: 100% !important;
  max-width: 100% !important;
  margin: 0 auto !important;
  padding-left: max(12px, env(safe-area-inset-left, 0px)) !important;
  padding-right: max(12px, env(safe-area-inset-right, 0px)) !important;
  padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)) !important;
  overflow-x: hidden !important;
}
.cz, .layer, #sh, #pk {
  width: 100% !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
}
/* Hide gray scrollbars everywhere (still allow intentional horizontal panning) */
* {
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}
*::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
/* Ensure text wraps and doesn't force horizontal overflow */
.game-title, .ttl, h1, h2, h3, .lab, .lb, .fb, p, span, .lst-meta, .game-profile-copy {
  overflow-wrap: anywhere;
  word-break: break-word;
  max-width: 100%;
}
/* Nav stays above system gesture / home indicator */
nav {
  padding-bottom: env(safe-area-inset-bottom, 0px) !important;
}
/* Kill splash remnants */
#splash { display: none !important; }
body.noanim #splash { display: none !important; }

#sh {

}

/* === P5-style transitions (matched to reference videos) === */
/* OPEN: diagonal red wipe covers screen → solid red → sheet visible */
@keyframes p5CoverIn {
  0%   { clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%); }
  100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
}
@keyframes p5CoverOut {
  0%   { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity:1; }
  100% { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); opacity:1; }
}
/* CLOSE: expanding jagged torn-paper hole (video 2) */
@keyframes p5TearIn {
  0%   { clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%); }
  35%  { clip-path: polygon(42% 38%, 58% 35%, 68% 48%, 62% 62%, 48% 68%, 35% 58%, 32% 45%, 40% 40%); }
  70%  { clip-path: polygon(18% 12%, 78% 8%, 95% 42%, 88% 88%, 45% 98%, 5% 85%, 2% 40%, 12% 15%); }
  100% { clip-path: polygon(-20% -20%, 120% -20%, 120% 120%, -20% 120%, -20% -20%, -20% -20%, -20% -20%, -20% -20%); }
}
@keyframes p5SheetIn {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}

@keyframes spSlashSweep {
  0%   { transform: translateX(-115%) skewX(-12deg); }
  48%  { transform: translateX(0%) skewX(-12deg); }
  100% { transform: translateX(115%) skewX(-12deg); }
}
@keyframes spSheetReveal {
  0%   { opacity: 0; transform: translateX(24px) skewX(-3deg); }
  100% { opacity: 1; transform: none; }
}

/* Red cover layer used on open — angled slash sweep into game sheet */
#sh.red-in {
  animation: none !important;
  opacity: 1 !important;
  background: transparent !important;
}
#sh.red-in::before {
  content: "" !important;
  position: fixed !important;
  inset: -10% -20% !important;
  z-index: 10002 !important;
  pointer-events: none !important;
  background: linear-gradient(105deg, #b80014 0%, #e60018 55%, #ff1e32 100%) !important;
  box-shadow: -14px 0 0 #0a0a0a, 14px 0 0 #ffffff !important;
  will-change: transform;
  transform: translateX(-115%) skewX(-12deg);
  animation: spSlashSweep .46s cubic-bezier(.16,.84,.24,1) forwards !important;
}
#sh.red-in .cz,
#sh.red-in .bgz {
  opacity: 0;
  animation: spSheetReveal .24s cubic-bezier(.22,.8,.36,1) .19s forwards !important;
}

.sp-pw-field {
  -webkit-text-security: disc;
  text-security: disc;
}
.sp-pw-field.is-visible {
  -webkit-text-security: none;
  text-security: none;
}

/* Close: sheet itself tears away with jagged expand then gone */
#sh.paper-out {
  display: block !important;
  animation: none !important;
  pointer-events: none !important;
}
#sh.paper-out::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 10003;
  pointer-events: none;
  background: #0a0a0a;
  clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%);
  animation: p5TearIn .55s cubic-bezier(.22,.7,.25,1) forwards;
  /* white torn edge via filter/outline simulation */
  box-shadow: 0 0 0 3px #fff;
}


/* Game sheet background – permanent, not only during transition */
#sh, #sh.on {
  background: #a50810 url(bg-game.webp) center center / cover no-repeat !important;
  background-attachment: scroll !important;
}
.bgz {
  background: #a50810 url(bg-game.webp) center center / cover no-repeat !important;
  background-image: url(bg-game.webp) !important;
  opacity: 1 !important;
  filter: none !important;
  inset: 0 !important;
  transform: none !important;
}


/* Library background stays still (no shift on search/re-render) */
body.t-lib .bgpat {
  background: #000 url(bg-library.webp) center center / cover no-repeat !important;
  background-attachment: scroll !important;
  transform: none !important;
  inset: 0 !important;
  animation: none !important;
  opacity: 1 !important;
}
body.t-lib .bgpat::after {
  display: none !important;
  animation: none !important;
}
body.t-lib {
  background: #000 !important;
}


/* game opens: no game background until the red wipe covers the old screen */
#sh.red-in:not(.bg-ready){background:none !important}

(function(){

    if(nativeAuth())return;

      if(!x || !x.A || !x.auth) return;

        try{sessionStorage.removeItem('sp_auth_pending');localStorage.removeItem('sp_auth_pending')}catch(e){}
        if(res && res.user){ USER = res.user; window.syncBad=0; if(tab==='set') render(); }
      }).catch(function(err){
        try{
          if(localStorage.getItem('sp_auth_pending')==='1'){
            localStorage.removeItem('sp_auth_pending');
            /* If we landed back with a broken redirect, surface a clear tip once */
            if(tab==='set') setTimeout(function(){msg('GOOGLE RETURNED BUT SESSION WAS LOST. ON ANDROID, ADD YOUR APP SHA-1 IN FIREBASE PROJECT SETTINGS → YOUR APPS.','OK')},600);
          }
        }catch(e){}
      });
    }).catch(function(){});
  }
  setTimeout(tryRedirect, 300);

})();
